{% extends 'base.html' %}

{% block title %}Home - Smart Farming Solution{% endblock %}

{% block content %}
<div class="bg-white shadow-2xl rounded-lg p-10 w-4/5 flex">
    <div class="w-1/2 pr-6">
        <h2 class="text-2xl font-semibold text-green-700 mb-6 text-center">Enter Crop Details</h2>

        <div class="mb-4">
            <label class="block text-gray-700 font-medium">Temperature (°C)</label>
            <input type="number" id="temperature" class="w-full p-3 border rounded-lg mt-2 focus:ring-2 focus:ring-green-500 outline-none shadow">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-medium">Humidity (%)</label>
            <input type="number" id="humidity" class="w-full p-3 border rounded-lg mt-2 focus:ring-2 focus:ring-green-500 outline-none shadow">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-medium">Soil Moisture (%)</label>
            <input type="number" id="soilMoisture" class="w-full p-3 border rounded-lg mt-2 focus:ring-2 focus:ring-green-500 outline-none shadow">
        </div>

        <button onclick="predictCrop()" class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition-all shadow-lg">
            Get Prediction
        </button>

        <div id="result" class="mt-4 text-lg font-bold text-green-700 text-center"></div>
    </div>

    <div class="w-1/2 flex justify-center items-center">
        <img id="cropImage" src="https://images.nationalgeographic.org/image/upload/t_RL2_search_thumb/v1638892233/EducationHub/photos/crops-growing-in-thailand.jpg" alt="Crop Image" class="w-64 h-64 object-cover rounded-lg">
    </div>
</div>

<div class="absolute right-6 top-1/2 transform -translate-y-1/2 flex flex-col space-y-4">
    <a href="{% url 'soil_prediction' %}" class="bg-white text-green-700 px-6 py-3 rounded-lg font-semibold shadow-lg hover:bg-gray-200 transition">
        Soil Prediction
    </a>
    <button class="bg-white text-green-700 px-6 py-3 rounded-lg font-semibold shadow-lg hover:bg-gray-200 transition">
        Crop Prediction
    </button>
    <a href="{% url 'weather_prediction' %}" class="bg-white text-green-700 px-6 py-3 rounded-lg font-semibold shadow-lg hover:bg-gray-200 transition">
        Weather Prediction
    </a>
    <button class="bg-white text-green-700 px-6 py-3 rounded-lg font-semibold shadow-lg hover:bg-gray-200 transition">
        Settings
    </button>
    <button class="bg-white text-green-700 px-6 py-3 rounded-lg font-semibold shadow-lg hover:bg-gray-200 transition">
        Help
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
    function predictCrop() {
        const temp = document.getElementById("temperature").value;
        const humidity = document.getElementById("humidity").value;
        const soilMoisture = document.getElementById("soilMoisture").value;

        fetch(`/api/predict/?temperature=${temp}&humidity=${humidity}&soil_moisture=${soilMoisture}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("result").innerText = "Error: " + data.error;
                } else {
                    document.getElementById("result").innerText = "Recommended Crop: " + data.recommended_crop;
                    document.getElementById("cropImage").src = "/static/images/" + data.recommended_crop.toLowerCase() + ".jpg";
                }
            })
            .catch(error => {
                document.getElementById("result").innerText = "Error connecting to server!";
            });
    }
</script>
{% endblock %}
